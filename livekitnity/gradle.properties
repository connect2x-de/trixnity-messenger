org.gradle.caching=true
org.gradle.caching.debug=false
org.gradle.configuration-cache=false
org.gradle.configuration-cache.entries-per-key=2
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=fail
org.gradle.configureondemand=false
org.gradle.console=auto
org.gradle.console.interactive=true
org.gradle.continue=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=300000
org.gradle.debug=false
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
org.gradle.jvmargs=-Xmx12g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dkotlin.daemon.jvm.options=-XX:MaxMetaspaceSize=1g,-Xmx8g -Dfile.encoding=UTF-8
org.gradle.logging.level=lifecycle
org.gradle.parallel=true
org.gradle.priority=low
org.gradle.problems.report=true
org.gradle.tooling.parallel=true
org.gradle.unsafe.isolated-projects=false
org.gradle.unsafe.isolated-projects.diagnostics=false
org.gradle.unsafe.isolated-projects.dangerously-ignore-problems=false
org.gradle.vfs.verbose=false
org.gradle.vfs.watch=true
org.gradle.warning.mode=summary
org.gradle.welcome=never

android.useAndroidX=true
